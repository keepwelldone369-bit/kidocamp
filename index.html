<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KidoCamp</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:sans-serif}
  body{background:#1D3557;overflow:hidden;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
  .b{background:#fff;color:#1D3557;padding:8px 16px;border-radius:25px;font-weight:900;border:3px solid #FFD166;pointer-events:auto;cursor:pointer}
  #v{display:none;position:fixed;inset:15px;background:#1D3557;color:#fff;border-radius:20px;padding:18px;z-index:99;border:3px solid #06D6A0}
  .vb{width:100%;padding:12px;background:#06D6A0;color:#1D3557;font-weight:900;border:none;border-radius:12px;margin-top:8px}
</style>
</head>
<body>
<div id="hud">
  <div class="b" id="lg">⛺ KidoCamp</div>
  <div class="b" style="background:#FFD166">⭐ <span id="st">0</span></div>
</div>
<canvas id="c"></canvas>
<div id="v">
  <h3 style="color:#FFD166">🔐 KidoCamp Studio</h3>
  <p style="margin:10px 0">الإجمالي: <b id="tp">0</b> | فودافون كاش 50%: <b id="wp" style="color:#06D6A0">0</b></p>
  <input type="number" id="ip" placeholder="ربح اليوم..." style="width:100%;padding:10px;border-radius:8px;border:none">
  <button class="vb" onclick="ap()">تحديث الأرباح</button>
  <button class="vb" style="background:#FFD166" onclick="au=!au;document.getElementById('v').style.display='none'">🎬 وضع الشورتس التلقائي</button>
  <button class="vb" style="background:#E63946;color:#fff" onclick="document.getElementById('v').style.display='none'">إغلاق</button>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=c.width=innerWidth,H=c.height=innerHeight,f=0,wi=0,sp=0,au=0,dr=null,bn=0,stars=+(localStorage.getItem('ks')||0);
document.getElementById('st').innerText=stars;
onresize=()=>{W=c.width=innerWidth;H=c.height=innerHeight;init();};
const ws=[{s:'#8ECAE6',g:'#FFD166',t:'⛺',a:'🪵',b:'🔶',c:'🏮'},{s:'#A8DADC',g:'#118AB2',t:'⛵',a:'🪵',b:'🏳️',c:'🛟'},{s:'#BDE0FE',g:'#06D6A0',t:'🌳',a:'🌱',b:'💧',c:'🍎'}];
let ts=[],zx=W*.55,zy=H*.58;
function init(){
  zx=W*.55;zy=H*.58;const w=ws[wi];
  ts=[w.a,w.b,w.c].map((em,i)=>({em,id:i,hx:W*(.22+i*.28),hy:H*.85,x:W*(.22+i*.28),y:H*.85,ok:0}));
}
function beep(q){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=q;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.2)}catch(e){}}
function loop(){
  f++;const w=ws[wi];
  x.fillStyle=w.s;x.fillRect(0,0,W,H);
  x.fillStyle='#FFD166';x.beginPath();x.arc(W-60,100,32,0,7);x.fill();
  x.fillStyle=w.g;x.fillRect(0,H*.56,W,H*.44);
  x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.roundRect(15,H*.76,W-30,H*.18,22);x.fill();
  x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.arc(zx,zy,52+Math.sin(f*.1)*4,0,7);x.stroke();
  x.font='75px sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText('🧒',W*.22,H*.6-Math.abs(Math.sin(f*.08))*10-bn);if(bn>0)bn*=.85;
  x.fillText(sp===0?'❓':sp===1?w.a:sp===2?w.b:w.t,zx,zy);
  if(au&&f%80===0&&sp<3){const o=ts.find(i=>i.id===sp);if(o)hit(o);}
  ts.forEach(i=>{if(!i.ok){x.fillStyle='#FFFDF7';x.beginPath();x.arc(i.x,i.y,34,0,7);x.fill();x.stroke();x.font='38px sans-serif';x.fillText(i.em,i.x,i.y);}});
  requestAnimationFrame(loop);
}
function hit(i){
  i.ok=1;sp++;bn=25;beep(500+sp*150);
  if(sp>=3){stars++;localStorage.setItem('ks',stars);document.getElementById('st').innerText=stars;setTimeout(()=>{sp=0;wi=(wi+1)%3;init();},1200);}
}
const gp=e=>{const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};};
c.ontouchstart=c.onmousedown=e=>{const p=gp(e);ts.forEach(i=>{if(!i.ok&&Math.hypot(p.x-i.x,p.y-i.y)<45)dr=i;});};
c.ontouchmove=c.onmousemove=e=>{if(dr){e.preventDefault();const p=gp(e);dr.x=p.x;dr.y=p.y;}};
window.ontouchend=window.onmouseup=()=>{if(dr){if(Math.hypot(dr.x-zx,dr.y-zy)<80&&dr.id===sp)hit(dr);else{dr.x=dr.hx;dr.y=dr.hy;beep(200);}dr=null;}};
let tp=0;document.getElementById('lg').onclick=()=>{if(++tp>=5){tp=0;if(prompt('PIN:')==='2026'){document.getElementById('v').style.display='block';sp2();}}};
function sp2(){const t=+(localStorage.getItem('kp')||0);document.getElementById('tp').innerText=t;document.getElementById('wp').innerText=t*.5;}
function ap(){const v=+document.getElementById('ip').value;if(v>0){localStorage.setItem('kp',+(localStorage.getItem('kp')||0)+v);document.getElementById('ip').value='';sp2();}}
init();loop();
</script>
</body>
</html>
