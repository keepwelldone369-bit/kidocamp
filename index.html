<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KidoCamp World</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: sans-serif; }
  html, body { width: 100%; height: 100%; background: #1D3557; overflow: hidden; }
  #app { position: relative; width: 100%; height: 100%; max-width: 480px; margin: 0 auto; background: #8ECAE6; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
  .badge { background: rgba(255,255,255,0.95); color: #1D3557; padding: 8px 16px; border-radius: 30px; font-weight: 900; font-size: 16px; border: 3px solid #FFD166; pointer-events: auto; cursor: pointer; }
  #vault { display: none; position: absolute; inset: 14px; background: rgba(29,53,87,0.98); color: #fff; border-radius: 24px; padding: 20px; z-index: 99; border: 3px solid #06D6A0; overflow-y: auto; }
  .v-row { display: flex; justify-content: space-between; margin: 12px 0; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 6px; }
  .v-in { width: 100%; padding: 12px; border-radius: 12px; border: none; margin: 8px 0; font-size: 16px; }
  .v-btn { width: 100%; padding: 14px; background: #06D6A0; color: #1D3557; font-weight: 900; border: none; border-radius: 14px; margin-top: 10px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="badge" id="logoBtn">⛺ KidoCamp</div>
    <div class="badge" style="background:#FFD166;">⭐ <span id="starNum">0</span></div>
  </div>
  <div id="vault">
    <h2 style="color:#FFD166;margin-bottom:8px;">🔐 غرفة القيادة (KidoCamp)</h2>
    <div class="v-row"><span>إجمالي الأرباح (ج.م):</span><strong id="totP">0</strong></div>
    <div class="v-row" style="color:#06D6A0;"><span>سحب فودافون كاش (50%):</span><strong id="withP">0</strong></div>
    <div class="v-row" style="color:#FFD166;"><span>إعادة استثمار (50%):</span><strong id="reinP">0</strong></div>
    <input type="number" id="inP" class="v-in" placeholder="أضف ربح اليوم (جنيه مصري)...">
    <button class="v-btn" onclick="addP()">تحديث وتقسيم الأرباح</button>
    <button class="v-btn" style="background:#FFD166;" onclick="toggleStudio()">🎬 وضع تسجيل الشورتس التلقائي</button>
    <button class="v-btn" style="background:#E63946;color:#fff;" onclick="document.getElementById('vault').style.display='none'">إغلاق</button>
  </div>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W = 360, H = 640;

function resize() {
  const el = document.getElementById('app');
  W = c.width = el.offsetWidth || window.innerWidth || 360;
  H = c.height = el.offsetHeight || window.innerHeight || 640;
  zone.x = W * 0.56;
  zone.y = H * 0.60;
  tools.forEach((it, i) => {
    it.hx = W * (0.22 + i * 0.28);
    it.hy = H * 0.86;
    if (!it.done && drag !== it) { it.x = it.hx; it.y = it.hy; }
  });
}

let actx = null;
function sfx(f, t, d, s = 0) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = t; o.frequency.setValueAtTime(f, actx.currentTime);
    if (s) o.frequency.exponentialRampToValueAtTime(s, actx.currentTime + d);
    g.gain.setValueAtTime(0.18, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (err) {}
}

let stars = parseInt(localStorage.getItem('kc_stars') || '0');
document.getElementById('starNum').innerText = stars;

const worlds = new Array(
  { id: 'camp', sky: '#8ECAE6', ground: '#FFD166', steps: new Array('poles', 'tent', 'lantern') },
  { id: 'sea',  sky: '#A8DADC', ground: '#118AB2', steps: new Array('hull', 'sail', 'lifebuoy') },
  { id: 'farm', sky: '#BDE0FE', ground: '#06D6A0', steps: new Array('seed', 'water', 'basket') }
);

let wIdx = 0, step = 0, frame = 0, studioMode = false, hookFlash = 45;
let particles = new Array();
let clouds = new Array({x:40,y:95,s:1},{x:210,y:145,s:0.8},{x:330,y:80,s:1.1});
let fish = {x: -50, y: 0, jump: 0}, drag = null, tools = new Array(), zone = {x:200, y:380, r:85};
let bounce = 0, happy = false;

function boom(x, y, col) {
  for (let i = 0; i < 20; i++) {
    particles.push({ x: x, y: y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.75)*10, sz: Math.random()*8+4, col: col, life: 1 });
  }
}

function initWorld() {
  const w = worlds[wIdx];
  zone = { x: W * 0.56, y: H * 0.60, r: 85 };
  hookFlash = 45;
  const list = w.steps.slice().sort(() => Math.random() - 0.5);
  tools = list.map((type, i) => ({
    type: type, hx: W * (0.22 + i * 0.28), hy: H * 0.86, x: W * (0.22 + i * 0.28), y: H * 0.86, done: false
  }));
  happy = false;
}

function drawBox(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawIcon(type, x, y, sc) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.lineWidth = 3; ctx.strokeStyle = '#1D3557';
  if (type === 'poles' || type === 'hull') {
    ctx.fillStyle = '#B5651D'; drawBox(-26, -10, 52, 20, 6); ctx.fill(); ctx.stroke();
  } else if (type === 'tent' || type === 'sail') {
    ctx.fillStyle = '#F77F00'; ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(24, 20); ctx.lineTo(-24, 20); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (type === 'lantern') {
    ctx.fillStyle = '#FFD166'; drawBox(-14, -18, 28, 36, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFFDF7'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
  } else if (type === 'lifebuoy') {
    ctx.fillStyle = '#F77F00'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFFDF7'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  } else if (type === 'seed') {
    ctx.fillStyle = '#06D6A0'; ctx.beginPath(); ctx.ellipse(0, 0, 12, 18, 0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  } else if (type === 'water') {
    ctx.fillStyle = '#118AB2'; ctx.beginPath(); ctx.arc(0, 5, 16, 0, Math.PI); ctx.lineTo(0, -20); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (type === 'basket') {
    ctx.fillStyle = '#FFD166'; drawBox(-20, -10, 40, 24, 6); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawExplorer(x, y) {
  const b = Math.sin(frame * 0.1) * 4 + bounce;
  ctx.save(); ctx.translate(x, y - b);
  ctx.fillStyle = '#118AB2'; drawBox(-18, -20, 36, 42, 12); ctx.fill();
  ctx.fillStyle = '#FFDCB6'; ctx.beginPath(); ctx.arc(0, -38, 20, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFD166'; ctx.beginPath(); ctx.ellipse(0, -52, 28, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -52, 15, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#1D3557'; ctx.beginPath(); ctx.arc(-7, -40, 3, 0, Math.PI*2); ctx.arc(7, -40, 3, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#1D3557'; ctx.lineWidth = 2.5; ctx.beginPath();
  if (happy) ctx.arc(0, -35, 8, 0, Math.PI);
  else ctx.arc(0, -33, 5, 0.1, Math.PI - 0.1);
  ctx.stroke(); ctx.restore();
  if (bounce > 0) bounce *= 0.88;
}

function drawSceneObject() {
  const w = worlds[wIdx], tx = zone.x, ty = zone.y;
  const displayStep = hookFlash > 0 ? 3 : step;
  if (hookFlash > 0) hookFlash--;

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(tx, ty, 58 + Math.sin(frame*0.08)*4, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  if (w.id === 'camp') {
    if (displayStep >= 1) { ctx.strokeStyle = '#5C3317'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(tx-45, ty+35); ctx.lineTo(tx, ty-45); ctx.lineTo(tx+45, ty+35); ctx.stroke(); }
    if (displayStep >= 2) { ctx.fillStyle = '#F77F00'; ctx.beginPath(); ctx.moveTo(tx, ty-45); ctx.lineTo(tx+48, ty+35); ctx.lineTo(tx-48, ty+35); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#1D3557'; ctx.beginPath(); ctx.moveTo(tx, ty-5); ctx.lineTo(tx+16, ty+35); ctx.lineTo(tx-16, ty+35); ctx.closePath(); ctx.fill(); }
    if (displayStep >= 3) { ctx.fillStyle = '#FFD166'; drawBox(tx-72, ty+10, 20, 26, 5); ctx.fill(); }
  } else if (w.id === 'sea') {
    if (displayStep >= 1) { ctx.fillStyle = '#F77F00'; ctx.beginPath(); ctx.arc(tx, ty+10, 48, 0, Math.PI); ctx.fill(); }
    if (displayStep >= 2) { ctx.fillStyle = '#FFFDF7'; ctx.beginPath(); ctx.moveTo(tx, ty-50); ctx.lineTo(tx+38, ty+5); ctx.lineTo(tx, ty+5); ctx.closePath(); ctx.fill(); }
    if (displayStep >= 3) { ctx.strokeStyle = '#FFFDF7'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(tx-22, ty+22, 11, 0, Math.PI*2); ctx.stroke(); }
  } else if (w.id === 'farm') {
    if (displayStep >= 1) { ctx.fillStyle = '#06D6A0'; ctx.beginPath(); ctx.arc(tx, ty+20, 16, 0, Math.PI*2); ctx.fill(); }
    if (displayStep >= 2) { ctx.fillStyle = '#B5651D'; ctx.fillRect(tx-10, ty-15, 20, 50); ctx.fillStyle = '#06D6A0'; ctx.beginPath(); ctx.arc(tx, ty-30, 38, 0, Math.PI*2); ctx.fill(); }
    if (displayStep >= 3) { ctx.fillStyle = '#F77F00'; ctx.beginPath(); ctx.arc(tx-15, ty-35, 8, 0, Math.PI*2); ctx.arc(tx+16, ty-25, 8, 0, Math.PI*2); ctx.fill(); }
  }
}

function loop() {
  frame++;
  const w = worlds[wIdx];
  ctx.fillStyle = w.sky; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W - 65, 115); ctx.rotate(frame * 0.01);
